name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Projeyi hazırla
        run: |
          echo "Repodaki dosyalar:"
          ls -la
          Z=$(find . -maxdepth 2 -iname '*.zip' | head -n 1)
          echo "Bulunan zip: $Z"
          if [ -z "$Z" ]; then echo "HATA: Repoda zip yok"; exit 1; fi
          mkdir proj
          unzip -o "$Z" -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: APK derle
        working-directory: proj
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: proj/app/build/outputs/apk/debug/app-debug.apk
