name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip aç
        run: |
          mkdir proj
          for Z in $(find . -maxdepth 2 -iname '*.zip'); do
            echo "Açılıyor: $Z"
            unzip -o "$Z" -d proj
          done
          echo "--- proj içeriği ---"
          find proj -maxdepth 4 | head -n 60
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: APK derle
        run: |
          S=$(find proj -name settings.gradle.kts | head -n 1)
          if [ -z "$S" ]; then echo "HATA: settings.gradle.kts zip içinde yok"; exit 1; fi
          D=$(dirname "$S")
          echo "Proje klasörü: $D"
          cd "$D"
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/app-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: app-debug.apk
